<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img" aria-label="Video analytics pipeline: YOLO, BoT-SORT, reasoning, alerts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1120" height="840" rx="34" fill="url(#bg)"/>

  <!-- "camera frame" -->
  <g filter="url(#sh)">
    <rect x="90" y="120" width="720" height="520" rx="26" fill="rgba(7,15,31,0.55)" stroke="rgba(255,255,255,0.18)"/>
    <rect x="120" y="150" width="660" height="460" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
    <!-- simple crowd silhouettes -->
    <path d="M170 520 C170 470,210 470,210 520" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="10" stroke-linecap="round"/>
    <path d="M260 520 C260 455,305 455,305 520" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="10" stroke-linecap="round"/>
    <path d="M360 520 C360 465,400 465,400 520" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="10" stroke-linecap="round"/>
    <!-- unattended bag -->
    <rect x="470" y="430" width="120" height="86" rx="14" fill="rgba(34,211,238,0.10)" stroke="rgba(34,211,238,0.55)" stroke-width="3"/>
    <text x="480" y="470" font-family="system-ui,Segoe UI,Arial" font-size="14" fill="rgba(255,255,255,0.78)" font-weight="800">BAG</text>
    <!-- person near -->
    <rect x="610" y="360" width="110" height="170" rx="18" fill="rgba(59,130,246,0.10)" stroke="rgba(59,130,246,0.55)" stroke-width="3"/>
    <text x="625" y="450" font-family="system-ui,Segoe UI,Arial" font-size="14" fill="rgba(255,255,255,0.78)" font-weight="800">PERSON</text>
  </g>

  <!-- side pipeline -->
  <g filter="url(#sh)">
    <rect x="850" y="140" width="200" height="120" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.16)"/>
    <text x="870" y="185" font-family="system-ui,Segoe UI,Arial" font-size="16" fill="rgba(255,255,255,0.88)" font-weight="900">YOLO</text>
    <text x="870" y="212" font-family="system-ui,Segoe UI,Arial" font-size="13" fill="rgba(255,255,255,0.62)">detections</text>
    <rect x="870" y="228" width="150" height="10" rx="6" fill="url(#g)" opacity="0.9"/>
  </g>
  <g filter="url(#sh)">
    <rect x="850" y="290" width="200" height="120" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.16)"/>
    <text x="870" y="335" font-family="system-ui,Segoe UI,Arial" font-size="16" fill="rgba(255,255,255,0.88)" font-weight="900">BoT-SORT</text>
    <text x="870" y="362" font-family="system-ui,Segoe UI,Arial" font-size="13" fill="rgba(255,255,255,0.62)">tracks</text>
    <rect x="870" y="378" width="150" height="10" rx="6" fill="url(#g)" opacity="0.75"/>
  </g>
  <g filter="url(#sh)">
    <rect x="850" y="440" width="200" height="120" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.16)"/>
    <text x="870" y="485" font-family="system-ui,Segoe UI,Arial" font-size="16" fill="rgba(255,255,255,0.88)" font-weight="900">Reasoning</text>
    <text x="870" y="512" font-family="system-ui,Segoe UI,Arial" font-size="13" fill="rgba(255,255,255,0.62)">spatial–temporal</text>
    <rect x="870" y="528" width="150" height="10" rx="6" fill="url(#g)" opacity="0.6"/>
  </g>
  <g filter="url(#sh)">
    <rect x="850" y="590" width="200" height="120" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.16)"/>
    <text x="870" y="635" font-family="system-ui,Segoe UI,Arial" font-size="16" fill="rgba(255,255,255,0.88)" font-weight="900">Alerts</text>
    <text x="870" y="662" font-family="system-ui,Segoe UI,Arial" font-size="13" fill="rgba(255,255,255,0.62)">WebSocket stream</text>
    <rect x="870" y="678" width="150" height="10" rx="6" fill="url(#g)" opacity="0.9"/>
  </g>

  <path d="M820 200 H850" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round"/>
  <path d="M820 350 H850" stroke="rgba(255,255,255,0.30)" stroke-width="3" stroke-linecap="round"/>
  <path d="M820 500 H850" stroke="rgba(255,255,255,0.26)" stroke-width="3" stroke-linecap="round"/>
  <path d="M820 650 H850" stroke="rgba(255,255,255,0.22)" stroke-width="3" stroke-linecap="round"/>

  <text x="90" y="720" font-family="system-ui,Segoe UI,Arial" font-size="18" fill="rgba(255,255,255,0.70)">
    Real-time suspicious behavior detection around unattended personal items (public / crowded scenes)
  </text>
</svg>
