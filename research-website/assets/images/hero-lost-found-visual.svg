<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img" aria-label="Lost and Found AI platform visual placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1120" height="840" rx="34" fill="url(#bg)"/>

  <!-- Main canvas -->
  <g filter="url(#sh)">
    <rect x="90" y="120" width="940" height="560" rx="28" fill="rgba(7,15,31,0.58)" stroke="rgba(255,255,255,0.18)"/>
    <rect x="120" y="150" width="880" height="500" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>

    <!-- Left: submission -->
    <rect x="160" y="200" width="250" height="170" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="182" y="238" font-family="system-ui,Segoe UI,Arial" font-size="14" fill="rgba(255,255,255,0.88)" font-weight="900">Submission</text>
    <text x="182" y="262" font-family="system-ui,Segoe UI,Arial" font-size="12" fill="rgba(255,255,255,0.55)">Text · Image · Voice</text>
    <rect x="182" y="286" width="200" height="10" rx="6" fill="rgba(255,255,255,0.12)"/>
    <rect x="182" y="306" width="168" height="10" rx="6" fill="rgba(255,255,255,0.10)"/>
    <rect x="182" y="326" width="188" height="10" rx="6" fill="rgba(255,255,255,0.08)"/>

    <!-- Center: retrieval -->
    <rect x="460" y="200" width="280" height="170" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="482" y="238" font-family="system-ui,Segoe UI,Arial" font-size="14" fill="rgba(255,255,255,0.88)" font-weight="900">Multimodal retrieval</text>
    <text x="482" y="262" font-family="system-ui,Segoe UI,Arial" font-size="12" fill="rgba(255,255,255,0.55)">Image + text + location</text>
    <rect x="482" y="290" width="226" height="10" rx="6" fill="url(#accent)" opacity="0.85"/>
    <rect x="482" y="314" width="200" height="10" rx="6" fill="rgba(255,255,255,0.10)"/>
    <rect x="482" y="338" width="184" height="10" rx="6" fill="rgba(255,255,255,0.08)"/>

    <!-- Right: safety -->
    <rect x="790" y="200" width="200" height="170" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="812" y="238" font-family="system-ui,Segoe UI,Arial" font-size="14" fill="rgba(255,255,255,0.88)" font-weight="900">Safety signals</text>
    <text x="812" y="262" font-family="system-ui,Segoe UI,Arial" font-size="12" fill="rgba(255,255,255,0.55)">Risk + video alerts</text>
    <rect x="812" y="292" width="150" height="10" rx="6" fill="rgba(34,211,238,0.18)" stroke="rgba(34,211,238,0.40)"/>
    <rect x="812" y="316" width="150" height="10" rx="6" fill="rgba(59,130,246,0.16)" stroke="rgba(59,130,246,0.40)"/>

    <!-- Bottom: dashboard -->
    <rect x="160" y="420" width="830" height="200" rx="22" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
    <text x="182" y="462" font-family="system-ui,Segoe UI,Arial" font-size="14" fill="rgba(255,255,255,0.88)" font-weight="900">Operator dashboard</text>
    <text x="182" y="486" font-family="system-ui,Segoe UI,Arial" font-size="12" fill="rgba(255,255,255,0.55)">Matches · Validation flags · Risk score · Alerts</text>
    <rect x="182" y="510" width="260" height="88" rx="14" fill="rgba(34,211,238,0.10)" stroke="rgba(34,211,238,0.35)"/>
    <rect x="460" y="510" width="260" height="88" rx="14" fill="rgba(59,130,246,0.10)" stroke="rgba(59,130,246,0.35)"/>
    <rect x="738" y="510" width="230" height="88" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
  </g>

  <!-- Connectors -->
  <path d="M410 285 H460" stroke="rgba(255,255,255,0.30)" stroke-width="3" stroke-linecap="round"/>
  <path d="M740 285 H790" stroke="rgba(255,255,255,0.30)" stroke-width="3" stroke-linecap="round"/>
  <path d="M300 370 C 300 410, 300 410, 300 420" stroke="rgba(255,255,255,0.22)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M600 370 C 600 410, 600 410, 600 420" stroke="rgba(255,255,255,0.22)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M890 370 C 890 410, 890 410, 890 420" stroke="rgba(255,255,255,0.22)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <text x="90" y="740" font-family="system-ui,Segoe UI,Arial" font-size="18" fill="rgba(255,255,255,0.68)">
    Placeholder visual  replace with your system overview or UI screenshots
  </text>
</svg>

